[project]
name = "python-docker-devcontainers"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "jupyter",
    "ipykernel",
    "pip>=26.1.2",
    "pip-audit",
    "notebook",
    "langchain>=1.3.9",
    "openai",
    "tiktoken",
    "matplotlib",
    "seaborn",
    "langchain-openai>=1.1.14",
    "gensim",
    "word-forms",
    "pytest",
    "pytest-asyncio",
    "mypy",
    "snakeviz",
    "langchain-community>=0.4.1",
    "anthropic>=0.40.0",
    "python-dotenv>=1.0.0",
    "reportlab>=4.0",
    "litellm[caching]>=1.84.0",
    "wordfreq",
    "tabulate>=0.10.0",
    "scipy",
    "scikit-learn>=1.8.0",
]

[tool.uv]
constraint-dependencies = [
    "aiohttp>=3.14.1",
    "bleach>=6.4.0",
    "click>=8.3.3",
    "idna>=3.15",
    "jupyter-server>=2.20.0",
    "jupyterlab>=4.5.10",
    "langchain-classic>=1.0.7",
    "langchain-core>=1.3.3",
    "langgraph-checkpoint>=4.1.1",
    "langgraph-sdk>=0.3.15",
    "langsmith>=0.8.18",
    "mistune>=3.3.0",
    "msgpack>=1.2.1",
    "pillow>=12.3.0",
    "setuptools>=83.0.0",
    "soupsieve>=2.8.4",
    "tornado>=6.5.7",
    "urllib3>=2.7.0",
]
