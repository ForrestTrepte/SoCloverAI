[project]
name = "python-docker-devcontainers"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "jupyter",
    "ipykernel",
    "pip>=26.1.2",
    "pip-audit",
    "notebook",
    "langchain",
    "openai",
    "tiktoken",
    "matplotlib",
    "seaborn",
    "langchain-openai",
    "gensim",
    "word-forms",
    "pytest",
    "pytest-asyncio",
    "mypy",
    "snakeviz",
    "langchain-community>=0.4.1",
    "anthropic>=0.40.0",
    "python-dotenv>=1.0.0",
    "reportlab>=4.0",
    "litellm[caching]>=1.84.0",
    "wordfreq",
    "tabulate>=0.10.0",
    "scipy",
    "scikit-learn>=1.8.0",
]

[tool.uv]
constraint-dependencies = [
    "idna>=3.15",
    "jupyter-server>=2.18.0",
    "mistune>=3.2.1",
    "setuptools>=83.0.0",
    "urllib3>=2.7.0",
]
